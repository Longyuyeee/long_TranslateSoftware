name: Build and publish signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          LONG_TRANSLATE_QUALITY_REPORT_DIR: ${{ github.workspace }}/quality-reports

      - name: Run strict Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Generate quality report
        run: npm run quality:report -- --require-runtime

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: quality-reports/quality-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Load versioned release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Missing versioned release notes: $notesPath"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          $delimiter = "RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          Get-Content -LiteralPath $notesPath -Raw >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Long翻译 v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "LongTranslate_[version]_[arch][_setup][ext]"
          retryAttempts: 2

      - name: Attach quality report to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.release_notes.outputs.version }}" "quality-reports/quality-report.json" --clobber

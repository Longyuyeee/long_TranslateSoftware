name: Build and publish signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Long翻译 v__VERSION__"
          releaseBody: |
            ## v0.4.3 启动与界面体验修复

            - 启用单实例运行，连续点击图标不会再产生多个托盘实例
            - 手动首次启动直接显示主界面，开机自启继续保持静默托盘模式
            - 改善低高度窗口的竖向滚动、间距与内容适配
            - 通知角标支持打开即已读、逐条移除、全部清除和点击外部关闭

            应用会在安装前验证更新包签名。完整说明见 `docs/releases/v0.4.3.md`。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "LongTranslate_[version]_[arch][_setup][ext]"
          retryAttempts: 2

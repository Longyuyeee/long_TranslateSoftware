name: Build and publish signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Audit frontend bundle size
        run: npm run audit:bundle

      - name: Audit browser extension package
        run: npm run audit:extension

      - name: Smoke test browser extension runtime
        run: npm run smoke:browser:runtime

      - name: Test Windows lifecycle process contract
        run: cargo test --manifest-path src-tauri/Cargo.toml --test lifecycle_process

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          LONG_TRANSLATE_QUALITY_REPORT_DIR: ${{ github.workspace }}/quality-reports
          LONG_TRANSLATE_REQUIRE_EN_US_OCR: "1"

      - name: Run strict Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Generate quality report
        run: npm run quality:report -- --require-runtime

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v6
        with:
          name: quality-report-${{ github.run_id }}
          path: quality-reports/quality-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Load versioned release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Release tag $env:GITHUB_REF does not match application version v$version"
          }
          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Missing versioned release notes: $notesPath"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          $delimiter = "RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          Get-Content -LiteralPath $notesPath -Raw >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Package browser extension
        id: browser_extension
        shell: pwsh
        run: |
          $asset = "LongTranslate_${{ steps.release_notes.outputs.version }}_browser_extension.zip"
          Compress-Archive -Path "browser-extension/dist/*" -DestinationPath $asset -CompressionLevel Optimal
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Long翻译 v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "LongTranslate_[version]_[arch][_setup][ext]"
          retryAttempts: 2

      - name: Attach extension and quality report to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "v${{ steps.release_notes.outputs.version }}"
          "${{ steps.browser_extension.outputs.asset }}"
          "quality-reports/quality-report.json" --clobber

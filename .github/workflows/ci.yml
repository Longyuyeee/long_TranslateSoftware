name: Continuous integration

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          LONG_TRANSLATE_QUALITY_REPORT_DIR: ${{ github.workspace }}/quality-reports

      - name: Run strict Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Generate quality report
        run: npm run quality:report -- --require-runtime

      - name: Upload quality report
        uses: actions/upload-artifact@v6
        with:
          name: quality-report-${{ github.run_id }}
          path: quality-reports/quality-report.json
          if-no-files-found: error
          retention-days: 30
